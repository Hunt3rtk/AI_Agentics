name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    name: Run tests and security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Node.js tests if package.json exists
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "Detected package.json — running npm ci and npm test"
            npm ci --cache .npm --prefer-offline
            if [ -f package-lock.json ] || [ -f package.json ]; then
              npm test --silent || (echo "npm test failed" && exit 1)
            fi
            echo "Running npm audit (fail on high)"
            npm audit --audit-level=high || (echo "npm audit found high/critical issues" && exit 1)
          else
            echo "No package.json found — skipping Node.js steps"
          fi

      - name: Run Python tests if requirements.txt or pyproject.toml exists
        shell: bash
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "Detected Python project — installing deps and running pytest"
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then
              pip install -r requirements.txt
            elif [ -f pyproject.toml ]; then
              pip install poetry
              poetry config virtualenvs.create false
              poetry install --no-interaction
            fi
            if command -v pytest >/dev/null 2>&1; then
              pytest -q || (echo "pytest failed" && exit 1)
            else
              echo "No pytest found — skipping Python tests"
            fi
            echo "Running pip-audit for dependency vulnerabilities"
            python -m pip install pip-audit
            python -m pip_audit || (echo "pip-audit found issues" && exit 1)
          else
            echo "No Python requirements found — skipping Python steps"
          fi

      - name: Lint and static analysis (generic)
        shell: bash
        run: |
          # Attempt common linters where available
          if [ -f package.json ]; then
            if npm run -s lint --silent; then
              echo "JS lint passed"
            else
              echo "JS lint failed"; exit 1
            fi
          fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            if command -v flake8 >/dev/null 2>&1; then
              flake8 || (echo "flake8 issues" && exit 1)
            else
              echo "flake8 not installed; skipping Python lint"
            fi
          fi

      - name: Upload test reports (if any)
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/test-results.xml
            **/reports/**
            junit_report.xml || true